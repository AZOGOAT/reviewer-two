name: Reviewer Two AI
description: Ask for a review on a PR and get a normal GitHub review back, inline comments and all. It never approves.
author: azogoat
branding:
  icon: user-check
  color: red
inputs:
  model:
    description: Model id string, claude-* (Anthropic), gpt-*/o* (OpenAI), or org/model (OpenAI-compatible endpoint)
    default: claude-opus-4-8
  max_tool_calls:
    description: Cap on exploration tool calls; a runaway guard, not a depth limit
    default: "50"
  exploration_token_budget:
    description: Total token cap; when spent, the review wraps up with what it has found
    default: "5000000"
  context_window_tokens:
    description: Context window of the model in tokens; sets how much diff goes in the prompt, and exploration wraps up 50k before it fills
    default: "200000"
  reasoning_effort:
    description: How hard the model reasons (none, minimal, low, medium, high, xhigh, max); empty keeps the model's default. Claude takes low to max, OpenAI models without reasoning ignore it, OpenAI-compatible servers decide what each value means
    default: ""
  max_inline_comments:
    description: Maximum inline review comments; the rest go into the review body
    default: "15"
  inline_severity_threshold:
    description: Minimum severity posted inline (critical, major, minor); nits never post inline
    default: minor
  request_changes_threshold:
    description: Minimum severity that turns the verdict into REQUEST_CHANGES
    default: major
  reviewer_login:
    description: Login of the machine account your team created; required for review_requested triggers
    default: ""
  pull_number:
    description: PR number, only needed for workflow_dispatch runs
    default: ""
  dry_run:
    description: Log the would-be review instead of posting it
    default: "false"
  github_token:
    description: Token used to read the PR and submit the review
    required: true
  anthropic_api_key:
    description: Anthropic API key, required for claude-* models
    default: ""
  openai_api_key:
    description: OpenAI API key, required for gpt-*/o* models
    default: ""
  openai_compatible_base_url:
    description: Base URL of an OpenAI-compatible endpoint, required for org/model ids
    default: ""
  openai_compatible_api_key:
    description: API key for the OpenAI-compatible endpoint
    default: ""
runs:
  using: node20
  main: dist/main.mjs
